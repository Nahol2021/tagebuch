<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Privat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600&display=swap">
<style>
/* Johans eigene Welt: Gewitter-Nachthimmel wie sein Desktop, Schrift und Zahlen in Chrom
   (Stahlblau → Platin wie seine Icons), Stärken als gravierte Metallplaketten.
   Bewusst nur dunkel. Vor dem Entsperren steht nur „Privat“ da. */
:root {
  --nacht: #0b111b;
  --himmel: #16223a;
  --platte: #141c2b;
  --platte-hoch: #1b2638;
  --kante: #2a3850;
  --text: #e6ebf3;
  --grau: #93a0b5;
  --leise: #6c7a90;
  --stahl: #7f9ec4;
  --platin: #eef2f8;
  --blitz: #c9dcff;
  --chrom: linear-gradient(180deg, #ffffff 0%, #dbe5f2 38%, #8ea8c9 62%, #e9eff7 100%);
  --anzeige: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --schrift: "Figtree", -apple-system, "Segoe UI", system-ui, Ubuntu, sans-serif;
  color-scheme: dark;
}
[hidden] { display: none !important; }
* { box-sizing: border-box; }
html { background: var(--nacht); }
body {
  margin: 0; min-height: 100vh; color: var(--text); font-family: var(--schrift);
  font-size: 16px; line-height: 1.55;
  background:
    radial-gradient(1200px 520px at 70% -120px, rgba(127, 158, 196, .28), transparent 70%),
    radial-gradient(700px 380px at 10% 0, rgba(201, 220, 255, .10), transparent 70%),
    linear-gradient(180deg, var(--himmel) 0, var(--nacht) 640px);
  background-repeat: no-repeat;
  padding: 40px 16px 64px;
}
.seite { max-width: 760px; margin: 0 auto; display: grid; gap: 28px; }
.chrom {
  background: var(--chrom); -webkit-background-clip: text; background-clip: text; color: transparent;
}
h1, h2, h3 { font-family: var(--anzeige); margin: 0; text-wrap: balance; }

/* Schloss */
#schloss { max-width: 360px; margin: 14vh auto 0; display: grid; gap: 14px; text-align: center; }
#schloss h1 { font-size: 2.2rem; font-weight: 800; letter-spacing: -.01em; }
#schloss input[type="password"] {
  font: inherit; color: var(--text); background: var(--platte); border: 1px solid var(--kante);
  border-radius: 12px; padding: 12px 14px; width: 100%;
}
#schloss label.merken { color: var(--grau); font-size: .9rem; display: flex; gap: 8px; justify-content: center; align-items: center; }
#fehler { color: #ffb4ab; font-size: .9rem; margin: 0; min-height: 1.3em; }

/* Kopf */
header { display: grid; gap: 10px; padding-top: 8px; }
header h1 { font-size: clamp(2.6rem, 8vw, 4.2rem); font-weight: 800; line-height: .95; letter-spacing: -.02em; }
.unterzeile { color: var(--grau); margin: 0; max-width: 46ch; }
.bilanz { display: flex; flex-wrap: wrap; gap: 8px 22px; margin: 6px 0 0; padding: 0; list-style: none; }
.bilanz li { display: grid; }
.bilanz b { font-family: var(--anzeige); font-size: 2rem; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.bilanz span { color: var(--grau); font-size: .85rem; }

.knopf {
  border: 0; font: inherit; font-weight: 600; cursor: pointer; border-radius: 999px;
  padding: 12px 22px; color: #0b111b; background: var(--chrom);
  box-shadow: 0 1px 0 rgba(255,255,255,.6) inset, 0 6px 20px rgba(127,158,196,.25);
}
.knopf:hover { filter: brightness(1.06); }
.knopf.still { background: transparent; color: var(--grau); border: 1px solid var(--kante); box-shadow: none; }
button:focus-visible, input:focus-visible, summary:focus-visible { outline: 2px solid var(--blitz); outline-offset: 3px; }

/* „Zeig mir was“ */
.zeig { display: grid; gap: 14px; justify-items: start; }
#zufall {
  width: 100%; border-left: 3px solid var(--blitz); padding: 6px 0 6px 18px; display: grid; gap: 4px;
}
#zufall-text { font-family: var(--anzeige); font-size: clamp(1.25rem, 3.4vw, 1.6rem); font-weight: 500; line-height: 1.3; margin: 0; }
#zufall-herkunft { color: var(--grau); font-size: .85rem; margin: 0; }
@media (prefers-reduced-motion: no-preference) {
  #zufall:not([hidden]) { animation: auf .35s ease-out; }
  @keyframes auf { from { opacity: 0; transform: translateY(6px); } }
}

/* Abschnitte */
.abschnitt { display: grid; gap: 14px; }
.abschnitt > h2 { font-size: 1.35rem; font-weight: 700; }
.abschnitt > p.hinweis { color: var(--grau); margin: -8px 0 0; font-size: .92rem; }

/* Stärken als Plaketten */
.plaketten { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
.plakette {
  position: relative; border-radius: 14px; padding: 16px 16px 14px;
  background: linear-gradient(160deg, var(--platte-hoch), var(--platte) 60%);
  border: 1px solid var(--kante);
  box-shadow: 0 1px 0 rgba(255,255,255,.06) inset;
  display: grid; gap: 6px; align-content: start;
}
.plakette .zahl { font-family: var(--anzeige); font-size: 2.4rem; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
.plakette .zahl small { font-family: var(--schrift); font-size: .8rem; font-weight: 500; color: var(--grau); margin-left: 6px; -webkit-text-fill-color: var(--grau); }
.plakette h3 { font-size: 1.1rem; font-weight: 700; }
.plakette p { margin: 0; color: var(--grau); font-size: .88rem; }
.plakette details { margin-top: 4px; }
.plakette summary { cursor: pointer; color: var(--stahl); font-size: .88rem; list-style: none; }
.plakette summary::-webkit-details-marker { display: none; }
.plakette summary::before { content: "▸ "; }
.plakette details[open] summary::before { content: "▾ "; }
.plakette details[open] { grid-column: 1 / -1; }
.belege { margin: 10px 0 0; padding-left: 1.1em; display: grid; gap: 6px; font-size: .92rem; }
.belege li::marker { color: var(--stahl); }
.plakette:has(details[open]) { grid-column: 1 / -1; }

/* Zuletzt geschafft */
.spitze { margin: 0; padding: 0; list-style: none; display: grid; gap: 10px; }
.spitze li {
  padding: 14px 16px; border-radius: 12px; background: var(--platte); border: 1px solid var(--kante);
  font-size: 1.02rem;
}

/* Wochen */
.woche { display: grid; gap: 16px; padding: 18px 20px; border-radius: 16px; background: rgba(20, 28, 43, .72); border: 1px solid var(--kante); }
.woche > h3 { font-size: 1.05rem; font-weight: 700; color: var(--platin); }
.woche > h3 span { color: var(--grau); font-family: var(--schrift); font-weight: 400; font-size: .9rem; margin-left: 8px; }
.tag { display: grid; gap: 8px; }
.tag h4 { margin: 0; font-size: .82rem; font-weight: 600; color: var(--stahl); letter-spacing: .04em; }
.tag .satz { margin: 0; font-family: var(--anzeige); font-size: 1.08rem; font-weight: 500; }
.punkte { margin: 0; padding-left: 1.1em; display: grid; gap: 6px; }
.punkte li { overflow-wrap: anywhere; }
.punkte li::marker { color: var(--leise); }
.punkte .art { color: var(--leise); font-size: .8rem; white-space: nowrap; }
.mehr { justify-self: start; background: none; border: 0; padding: 0; color: var(--stahl); font: inherit; font-size: .88rem; cursor: pointer; }
.klein { color: var(--grau); font-size: .8rem; }
.datum-klein { color: var(--leise); font-size: .8rem; white-space: nowrap; }
footer { text-align: center; }
@media (max-width: 480px) {
  body { padding-top: 28px; }
  .woche { padding: 16px; }
}
</style>
</head>
<body>

<form id="schloss" autocomplete="on">
  <h1 class="chrom">Privat</h1>
  <input type="password" id="passwort" autocomplete="current-password" placeholder="Passwort" aria-label="Passwort">
  <label class="merken"><input type="checkbox" id="merken"> Auf diesem Gerät merken</label>
  <button class="knopf" type="submit" id="oeffnen">Öffnen</button>
  <p id="fehler" role="alert"></p>
</form>

<div class="seite" id="inhalt" hidden>
  <header>
    <h1 class="chrom">Was ich kann</h1>
    <p class="unterzeile">Was ich wirklich selbst gemacht, gedacht und durchgezogen habe. Jeder Punkt ist echt und belegt.</p>
    <ul class="bilanz" id="bilanz"></ul>
  </header>

  <div class="zeig">
    <button class="knopf" id="zeig" type="button">Zeig mir was</button>
    <div id="zufall" hidden>
      <p id="zufall-text"></p>
      <p id="zufall-herkunft"></p>
    </div>
  </div>

  <section class="abschnitt" id="staerken-teil">
    <h2 class="chrom">Was mich ausmacht</h2>
    <p class="hinweis">Jede Stärke sammelt Belege. Je länger das Tagebuch läuft, desto länger die Liste.</p>
    <div class="plaketten" id="plaketten"></div>
  </section>

  <section class="abschnitt" id="spitze-teil" hidden>
    <h2 class="chrom">Zuletzt geschafft</h2>
    <ul class="spitze" id="spitze-liste"></ul>
  </section>

  <section class="abschnitt">
    <h2 class="chrom">Woche für Woche</h2>
    <div id="wochen" class="abschnitt"></div>
  </section>

  <footer><button class="knopf still" id="sperren" type="button">Sperren</button></footer>
</div>

<script>
const ARTEN = {
  geschafft: "geschafft",
  idee:      "eigene Idee",
  loesung:   "selbst draufgekommen",
  einwand:   "nachgehakt",
  problem:   "Problem überwunden",
};
/* „Zeig mir was“ ist der Knopf für schlechte Abende: nur Einträge, die für sich allein aufbauen.
   Nachgehakt-Einträge klingen ohne Zusammenhang leicht nach Fehler („Versehen“, „korrigiert“). */
const AUFBAUEND = ["geschafft", "problem", "loesung", "idee"];
/* Zahl und Einheit zusammenhalten („19 s“ nicht als „19 / s“) */
const zusammen = (t) => t.replace(/(\d) (?=(s|ms|%|GB|MB|KB|Sekunden?|Minuten?|Stunden?|Tage?n?|WPM|Wörter)\b)/g, "$1 ");
const SPEICHER = "tagebuch-schluessel";
let tage = [], staerken = [];

const $ = (id) => document.getElementById(id);
const aus64 = (s) => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const in64 = (b) => btoa(String.fromCharCode(...new Uint8Array(b)));
const datum = (iso, opt) => new Date(iso + "T12:00:00").toLocaleDateString("de-DE", opt);
const datumLang = (iso) => datum(iso, { weekday: "long", day: "numeric", month: "long" });
const datumKurz = (iso) => datum(iso, { day: "numeric", month: "long" });
function el(tag, attrs = {}, kinder = []) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) k === "text" ? (e.textContent = v) : e.setAttribute(k, v);
  for (const k of [].concat(kinder)) if (k) e.append(k);
  return e;
}
const lies = (k) => { try { return localStorage.getItem(k); } catch { return null; } };
const schreib = (k, v) => { try { v === null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch {} };

/* Entschlüsseln: PBKDF2-SHA256 → AES-256-GCM, passend zu veroeffentlichen.py */
async function ladeDaten() {
  const r = await fetch("daten.enc?" + Date.now(), { cache: "no-store" });
  if (!r.ok) throw new Error("netz");
  return r.json();
}
async function schluesselAus(passwort, paket) {
  const roh = await crypto.subtle.importKey("raw", new TextEncoder().encode(passwort), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey(
    { name: "PBKDF2", hash: "SHA-256", salt: aus64(paket.salz), iterations: paket.runden },
    roh, { name: "AES-GCM", length: 256 }, true, ["decrypt"]);
}
async function entschluesseln(schluessel, paket) {
  const klar = await crypto.subtle.decrypt({ name: "AES-GCM", iv: aus64(paket.iv) }, schluessel, aus64(paket.daten));
  return JSON.parse(new TextDecoder().decode(klar));
}

async function oeffnen(schluessel, paket, merken) {
  const daten = await entschluesseln(schluessel, paket);
  if (merken) schreib(SPEICHER, paket.salz + ":" + in64(await crypto.subtle.exportKey("raw", schluessel)));
  tage = daten.tage || [];
  staerken = daten.staerken || [];
  $("schloss").hidden = true; $("inhalt").hidden = false;
  document.title = "Was ich kann";
  zeichnen();
}

$("schloss").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  $("fehler").textContent = ""; $("oeffnen").disabled = true; $("oeffnen").textContent = "Öffne …";
  try {
    const paket = await ladeDaten();
    await oeffnen(await schluesselAus($("passwort").value, paket), paket, $("merken").checked);
    $("passwort").value = "";
  } catch (e) {
    $("fehler").textContent = e.message === "netz" ? "Keine Verbindung. Später nochmal versuchen." : "Passwort stimmt nicht.";
  } finally {
    $("oeffnen").disabled = false; $("oeffnen").textContent = "Öffnen";
  }
});

$("sperren").addEventListener("click", () => {
  schreib(SPEICHER, null); tage = []; staerken = [];
  $("inhalt").hidden = true; $("schloss").hidden = false; $("zufall").hidden = true;
  document.title = "Privat";
});

/* Gemerkter Schlüssel: gilt, solange das Passwort (und damit das Salz) gleich bleibt */
(async () => {
  const g = lies(SPEICHER);
  if (!g) return;
  try {
    const paket = await ladeDaten();
    const [salz, roh] = g.split(":");
    if (salz !== paket.salz) { schreib(SPEICHER, null); return; }
    const k = await crypto.subtle.importKey("raw", aus64(roh), "AES-GCM", true, ["decrypt"]);
    await oeffnen(k, paket, false);
  } catch { schreib(SPEICHER, null); }
})();

function allePunkte() {
  return tage.flatMap(t => (t.punkte || []).map(p => ({ ...p, datum: t.datum })))
             .filter(p => ARTEN[p.art] && p.text);
}

/* Montag der Woche als Schlüssel */
function wochenStart(iso) {
  const d = new Date(iso + "T12:00:00");
  d.setDate(d.getDate() - ((d.getDay() + 6) % 7));
  return d.toISOString().slice(0, 10);
}

function zeichnen() {
  const punkte = allePunkte();
  const ersterTag = punkte.map(p => p.datum).sort()[0];

  /* Bilanz: zuerst, was geschafft ist – die Zahl der Tage ist kein Maßstab */
  const n = (a) => punkte.filter(p => p.art === a).length;
  const sichtbar = staerken.filter(s => punkte.filter(p => (p.staerken || []).includes(s.name)).length >= 2).length;
  const zahlen = [[punkte.length, "Dinge selbst gemacht"], [sichtbar, "Stärken mit Belegen"],
                  [n("idee"), "eigene Ideen"], [n("problem"), "Probleme überwunden"]];
  $("bilanz").replaceChildren(...zahlen.map(([z, t]) => el("li", {}, [el("b", { class: "chrom", text: String(z) }), el("span", { text: t })])));

  /* Stärken: sortiert nach Zahl der Belege, jede mit allen Belegen zum Aufklappen */
  const mitBelegen = staerken.map(s => ({ ...s, belege: punkte.filter(p => (p.staerken || []).includes(s.name)) }))
    /* Erst ab 2 Belegen zeigen: eine Stärke mit einem einzigen Beleg wirkt an schlechten Tagen dünn */
    .filter(s => s.belege.length >= 2).sort((a, b) => b.belege.length - a.belege.length);
  $("plaketten").replaceChildren(...mitBelegen.map(s => {
    const liste = el("ul", { class: "belege" }, [...s.belege].sort((a, b) => b.datum.localeCompare(a.datum))
      .map(p => el("li", {}, [zusammen(p.text) + " ", el("span", { class: "datum-klein", text: "· " + datumKurz(p.datum) })])));
    return el("article", { class: "plakette" }, [
      el("div", { class: "zahl chrom" }, [String(s.belege.length), el("small", { text: s.belege.length === 1 ? "Beleg" : "Belege" })]),
      el("h3", { text: s.name }),
      el("p", { text: s.beschreibung || "" }),
      el("details", {}, [el("summary", { text: "Belege ansehen" }), liste]),
    ]);
  }));
  $("staerken-teil").hidden = !mitBelegen.length;

  /* Zuletzt geschafft: die drei neuesten „Geschafft“-Einträge, solche mit Zahlen zuerst –
     an schlechten Abenden soll man nichts suchen oder entscheiden müssen */
  const geschafft = punkte.filter(p => p.art === "geschafft");
  const spitze = [...geschafft.filter(p => /\d/.test(p.text)), ...geschafft.filter(p => !/\d/.test(p.text))]
    .sort((a, b) => b.datum.localeCompare(a.datum)).slice(0, 3);
  $("spitze-liste").replaceChildren(...spitze.map(p => el("li", {}, [zusammen(p.text) + " ",
    el("span", { class: "datum-klein", text: "· " + datumKurz(p.datum) })])));
  $("spitze-teil").hidden = !spitze.length;

  /* Woche für Woche: Ein magerer Tag steht nie allein, er gehört zu seiner Woche.
     Gewichtige Punkte zuerst, der Rest hinter „weitere zeigen“ – nie als „Kleinigkeiten“ benannt. */
  const wochen = {};
  for (const t of tage) (wochen[wochenStart(t.datum)] ||= []).push(t);
  const box = $("wochen"); box.replaceChildren();
  for (const start of Object.keys(wochen).sort().reverse()) {
    const wp = punkte.filter(p => wochenStart(p.datum) === start);
    if (!wp.length) continue;
    const karte = el("article", { class: "woche" }, [
      el("h3", {}, ["Woche ab " + datumKurz(start), el("span", { text: `${wp.length} Einträge` })])]);
    const versteckt = [];
    for (const t of wochen[start].sort((a, b) => b.datum.localeCompare(a.datum))) {
      const tp = wp.filter(p => p.datum === t.datum);
      if (!tp.length) continue;
      /* Gewicht fehlt bei alten Einträgen → zählt als gewichtig */
      const stark = tp.filter(p => (p.gewicht ?? 2) >= 2);
      const zeigen = stark.length ? stark : tp;
      const ul = el("ul", { class: "punkte" }, zeigen.map(p =>
        el("li", {}, [zusammen(p.text) + " ", el("span", { class: "art", text: "· " + ARTEN[p.art] })])));
      const rest = tp.filter(p => !zeigen.includes(p));
      for (const p of rest) {
        const li = el("li", { hidden: "" }, [zusammen(p.text) + " ", el("span", { class: "art", text: "· " + ARTEN[p.art] })]);
        ul.append(li); versteckt.push(li);
      }
      karte.append(el("section", { class: "tag" }, [
        el("h4", { text: datumLang(t.datum) }),
        t.satz ? el("p", { class: "satz", text: t.satz }) : null, ul]));
    }
    if (versteckt.length) {
      const b = el("button", { class: "mehr", type: "button", text: `${versteckt.length} weitere zeigen` });
      b.addEventListener("click", () => { versteckt.forEach(li => li.hidden = false); b.remove(); });
      karte.append(b);
    }
    box.append(karte);
  }
}

$("zeig").addEventListener("click", () => {
  let p = allePunkte().filter(x => AUFBAUEND.includes(x.art) && (x.gewicht ?? 2) >= 2);
  if (!p.length) return;
  const mitZahl = p.filter(x => /\d/.test(x.text));
  if (mitZahl.length >= 3 && Math.random() < 0.7) p = mitZahl;
  const x = p[Math.floor(Math.random() * p.length)];
  $("zufall-text").textContent = zusammen(x.text);
  const st = (x.staerken || [])[0];
  $("zufall-herkunft").textContent = `${datumLang(x.datum)}${st ? " · " + st : ""}`;
  $("zufall").hidden = false;
});
</script>
</body>
</html>
